<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- AK monogram in Instrument Sans on the accent vermilion. Modern browsers
       use the SVG; the .ico covers older ones and the automatic /favicon.ico
       request, which would otherwise fall through to the SPA catch-all. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f6" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0c0b" />

  <title>Ahmad Fareed Khan - AI & Machine Learning Engineer</title>
  <meta name="description"
    content="AI engineer building production LLM apps, workflow automation, and computer vision systems. 5+ years of applied AI delivery for startups and product teams." />
  <meta name="author" content="Ahmad Fareed Khan" />
  <link rel="canonical" href="https://ahmadfareedkhan.tech/" />

  <!-- Fonts: preconnect + stylesheet link is render-blocking-safe and much faster
       than an @import inside index.css, which delays discovery until CSS is parsed. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" />

  <meta property="og:title" content="Ahmad Fareed Khan - AI & Machine Learning Engineer" />
  <meta property="og:description"
    content="AI engineer building production LLM apps, workflow automation, and computer vision systems." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ahmadfareedkhan.tech/" />
  <meta property="og:image" content="https://ahmadfareedkhan.tech/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="Ahmad Fareed Khan, AI Engineer: I build AI systems that hold up in production. Portrait on the right." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ahmad Fareed Khan - AI & Machine Learning Engineer" />
  <meta name="twitter:description"
    content="AI engineer building production LLM apps, workflow automation, and computer vision systems." />
  <meta name="twitter:image" content="https://ahmadfareedkhan.tech/og-image.jpg" />

  <!-- Structured data is emitted per route by useDocumentHead: the home page
       describes a Person, each case study a CreativeWork. A static block here
       as well would duplicate the Person entry on the home page. -->
  <!-- Applies the theme before first paint. Without this, a prerendered page
       ships with no theme class, so a dark-mode visitor sees a white flash
       until React mounts and next-themes catches up. Keep it inline and
       synchronous: an external or deferred script is too late to help.
       The storage key must match next-themes' default ("theme"). -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        /* Private mode or blocked storage: fall through to the CSS default. */
      }
    })();
  </script>

</head>

<body>
  <div id="root"></div>
  <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
